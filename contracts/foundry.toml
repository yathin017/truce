[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "preserve"

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
monad_testnet = "${MONAD_RPC_URL}"

# Reservoir — gas-aware keeper coordination layer. Monad testnet chainId 10143.
